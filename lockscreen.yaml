widgets:
  clock:
    type: "builtin.clock"
    class-name: "clock-widget"  # CSS class name
    options:
      label: "%I:%M %p"  # strftime format string
    position: "center"  # position: north, south, east, west, and combinations
    offset_y: -300  # offset from the position by pixels. can be negative
    offset_x: 0  # same as the offset y
  date:
    type: "builtin.clock"
    class-name: "date-widget"
    options:
      label: "%A, %B, %d"
    position: "center"
    offset_y: -200
    offset_x: 0
  weather:
    type: "builtin.custom"
    class-name: "weather-widget"
    position: "southwest"
    offset_y: -10
    offset_x: 10
    options:
      label: "{weather-else.nearest_area.areaName.value}, {weather-else.nearest_area.country.value}\
              \n{weather-else.current_condition.weatherDesc.value}\
              \n{weather-temp}\
              \n{weather-else.current_condition.humidity}%"
    exec_options:
      commands:
        weather-temp:
          run_cmd: "cat ~/weather.txt"
          return_format: "text"
        weather-else:
          run_cmd: "cat ~/weather.json"
          return_format: "json"
      run_interval: 300000
