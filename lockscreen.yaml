widgets:
  clock:  # This will be the class name for the css: clock-widget
    type: "builtin.clock"  # in the future we'll add more like: `custom.custom`
    class-name: "clock-widget"
    options:
      label: "%I:%M %p"  # strftime format string
    position: "center"  # position: north, south, east, west, and combinations
    offset_y: 0  # offset from the position by pixels. can be negative
    offset_x: 0  # same as the offset y
  weather:
    type: "builtin.custom"
    class-name: "weather-widget"
    options:
      label: "{current_condition.weatherDesc.value}"
    position: "southwest"
    exec_options:
      run_cmd: "curl -s wttr.in/dumaguete?format=j2"
      run_interval: 300000
      return_format: "json"
    offset_x: 0
    offset_y: 0

