background:
  screenshot: false # true for screenshot, false for custom image
  path: "~/Pictures/gowall/sui-megane.jpg"           # Absolute or relative path to image file
  blur: true         # Apply blur effect
  blur_radius: 20    # Blur intensity (sigma)
  darken: 0.5        # Darken intensity (0.0 to 1.0)

widgets:
  clock:
    type: "builtin.clock"
    class-name: "clock-widget"  # CSS class name
    options:
      label: "%I"  # strftime format string
    position: "center"  # position: north, south, east, west, and combinations
    offset_y: -200 # offset from the position by pixels. can be negative
    offset_x: 0  # same as the offset y
  date:
    type: "builtin.clock"
    class-name: "date-widget"
    options:
      label: "%M"
    position: "center"
    offset_y: 150
    offset_x: 0
  weather:
    type: "builtin.custom"
    class-name: "weather-widget"
    position: "southwest"
    offset_y: -10
    offset_x: 10
    options:
      label: "{weather-else.nearest_area.areaName.value}, {weather-else.nearest_area.country.value}\
              \n{weather-else.current_condition.weatherDesc.value}\
              \n{weather-temp}\
              \n{weather-else.current_condition.humidity}%"
    exec_options:
      commands:
        weather-temp:
          run_cmd: "bash ~/.config/eww/scripts/weather.sh"
          return_format: "text"
        weather-else:
          run_cmd: "curl wttr.in/dumaguete?format=j2"
          return_format: "json"
      run_interval: 300000
